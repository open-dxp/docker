name: Docker Build & Release

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*.*.*'
    schedule:
        -   cron: '30 2 * * 1,3,5'

env:
    IMAGE_NAME: opendxp/opendxp
    DEBIAN_VERSION: trixie

jobs:
    resolve:
        name: Resolve versions
        runs-on: ubuntu-latest
        if: github.repository == 'open-dxp/docker'
        outputs:
            builds: ${{ steps.resolve.outputs.builds }}
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Resolve versions
                id: resolve
                run: |
                    set -euo pipefail

                    latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
                    refs=()

                    if [[ $GITHUB_REF == refs/tags/* ]]; then
                        refs+=("$GITHUB_REF_NAME")
                    else
                        # The cron and a manual run rebuild the newest release and the development branch of each major
                        # version, so the images get the security updates of Debian and PHP.
                        for major in $(git tag -l 'v*.*.*' | sed -E 's/^v([0-9]+)\..*$/\1/' | sort -un); do
                            refs+=("$(git tag -l "v$major.*.*" --sort=-v:refname | head -1)")

                            if git ls-remote --exit-code --heads origin "$major.x" >/dev/null; then
                                refs+=("$major.x")
                            fi
                        done
                    fi

                    for ref in "${refs[@]}"; do
                        for php in 8.3 8.4 8.5; do
                            jq -nc --arg ref "$ref" --arg php "$php" --arg latest "$latest" \
                                '{ref: $ref, php: $php, latest: ($ref == $latest)}'
                        done
                    done | jq -sc '"builds=\(.)"' -r >> "$GITHUB_OUTPUT"

    build-image:
        name: Build images
        needs: resolve
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                runner:
                    - ubuntu-22.04
                    - ubuntu-22.04-arm
                build: ${{ fromJSON(needs.resolve.outputs.builds) }}

        steps:
            -   uses: actions/checkout@v7
                with:
                    ref: ${{ matrix.build.ref }}

            -   name: Login to DockerHub Registry
                run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            -   name: Build images
                env:
                    REF: ${{ matrix.build.ref }}
                    PHP: ${{ matrix.build.php }}
                    LATEST: ${{ matrix.build.latest }}
                    ARCH: ${{ contains(matrix.runner, 'arm') && 'arm64' || 'amd64' }}
                run: |
                    set -euo pipefail

                    # A release v1.2.0 is published as -v1, -v1.2 and, if it is the newest, -latest. A branch 1.x as -v1-dev.
                    if [[ $REF =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
                        versions=("v${BASH_REMATCH[1]}" "v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}")
                        detailed=${versions[1]}

                        if [[ $LATEST == true ]]; then
                            versions+=(latest)
                        fi
                    else
                        versions=("v${REF%.x}-dev")
                        detailed=${versions[0]}
                    fi

                    patch=$(docker run --rm "php:$PHP-fpm-$DEBIAN_VERSION" php -r 'echo PHP_VERSION;')

                    for variant in min default max debug supervisord; do
                        if [[ $variant == default ]]; then
                            base="php$PHP"
                            base_detailed="php$patch"
                        else
                            base="php$PHP-$variant"
                            base_detailed="php$patch-$variant"
                        fi

                        tags=()

                        for version in "${versions[@]}"; do
                            tags+=("$IMAGE_NAME:$base-$version")
                        done

                        tags+=("$IMAGE_NAME:$base_detailed-$detailed")

                        args=(--tag "opendxp-$variant")

                        for tag in "${tags[@]}"; do
                            args+=(--tag "$tag-$ARCH")
                            echo "$tag" >> aggregated_tags.txt
                        done

                        docker build "${args[@]}" \
                            --target "opendxp_php_$variant" \
                            --build-arg PHP_VERSION="$PHP" \
                            --build-arg DEBIAN_VERSION="$DEBIAN_VERSION" \
                            .
                    done

            # The same gate as in the tests. Nothing is pushed while a fixable critical or high vulnerability remains.
            -   name: Run Trivy vulnerability scanner (supervisord)
                uses: aquasecurity/trivy-action@v0.36.0
                with:
                    image-ref: 'opendxp-supervisord'
                    format: 'table'
                    exit-code: '1'
                    ignore-unfixed: true
                    vuln-type: 'os,library'
                    severity: 'CRITICAL,HIGH'

            -   name: Run Trivy vulnerability scanner (max)
                uses: aquasecurity/trivy-action@v0.36.0
                with:
                    image-ref: 'opendxp-max'
                    format: 'table'
                    exit-code: '1'
                    ignore-unfixed: true
                    vuln-type: 'os,library'
                    severity: 'CRITICAL,HIGH'

            -   name: Push images
                run: docker push --all-tags "$IMAGE_NAME"

            -   name: Upload aggregated tags
                uses: actions/upload-artifact@v7
                with:
                    name: aggregated_tags_${{ matrix.runner }}_${{ matrix.build.ref }}_${{ matrix.build.php }}
                    path: aggregated_tags.txt

    process-tags:
        runs-on: ubuntu-22.04
        needs: build-image
        steps:

            -   name: Login to DockerHub Registry
                run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            -   name: Download aggregated tags
                uses: actions/download-artifact@v8
                with:
                    path: artifacts

            -   name: Process tags
                run: |
                    find artifacts -type f -name "aggregated_tags.txt" -exec cat {} + > all_aggregated_tags.txt

                    readarray -t TAGS_ARRAY < all_aggregated_tags.txt

                    declare -A UNIQUE_TAGS
                    for tag in "${TAGS_ARRAY[@]}"; do
                        UNIQUE_TAGS["$tag"]=1
                    done

                    for tag in "${!UNIQUE_TAGS[@]}"; do
                    
                        echo "Processing tag: $tag"
                        
                        docker manifest create "$tag" \
                        --amend "${tag}-amd64" \
                        --amend "${tag}-arm64"

                        docker manifest push "$tag"
    
                    done

